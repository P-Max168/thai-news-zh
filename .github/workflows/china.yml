# 🇨🇳 '中国要闻' 칸 갱신(판과 무관) — data/china.json + data/china.js (tools/fetch_china.py, zh 전용)
# + 💱 헤더 시세 칩(바트→위안 THB_CNY·금시세) — data/ticker.json|js (tools/fetch_ticker.py, 공유 코드)
# korea.yml(한국판)과 같은 구조(공유 시스템 패턴, 2026-10-18 Grok 이 R-zh-3 로 만듦).
# 시각(방콕): 2시간마다 :17 (UTC '17 */2 * * *'). 판 빌드와 겹치지 않게
#   시작 시각이 07:20–08:30, 12:20–13:30, 18:20–19:30 BKK 면 끝날 때까지 기다린 뒤 실행(2026-10-27 3판).
name: china-news

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "항목이 같아도 updated_at 을 새로 써서 커밋(--force)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: china-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Bangkok
    steps:
      - name: 판 빌드 시간대(07:20–08:30, 12:20–13:30, 18:20–19:30 BKK)면 기다리기
        run: |
          h=$((10#$(date +%H))); m=$((10#$(date +%M))); w=0
          # am
          if [ "$h" = 7 ] && [ "$m" -ge 20 ]; then w=$(( (90 - m) * 60 ));
          elif [ "$h" = 8 ] && [ "$m" -lt 30 ]; then w=$(( (30 - m) * 60 ));
          # md
          elif [ "$h" = 12 ] && [ "$m" -ge 20 ]; then w=$(( (90 - m) * 60 ));
          elif [ "$h" = 13 ] && [ "$m" -lt 30 ]; then w=$(( (30 - m) * 60 ));
          # pm
          elif [ "$h" = 18 ] && [ "$m" -ge 20 ]; then w=$(( (90 - m) * 60 ));
          elif [ "$h" = 19 ] && [ "$m" -lt 30 ]; then w=$(( (30 - m) * 60 )); fi
          [ "$w" -gt 0 ] && { echo "판 빌드 시간대 $(date +%H:%M) BKK → ${w}s 대기"; sleep "$w"; }
          echo "시작: $(date '+%F %H:%M') BKK"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 의존성
        run: pip install --quiet googlenewsdecoder

      - name: 中国要闻 수집(data/china.json|js)
        id: china
        continue-on-error: true
        run: TNK_LANG=zh python3 tools/fetch_china.py --standalone ${{ inputs.force && '--force' || '' }}

      - name: 시세 수집(환율·금시세 → data/ticker.json|js)
        id: ticker
        continue-on-error: true
        run: TNK_LANG=zh python3 tools/fetch_ticker.py

      - name: 바뀌었으면 커밋·push (pull --rebase, 재시도)
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/china.json data/china.js
          [ -f data/ticker.json ] && git add data/ticker.json data/ticker.js
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 안 함"; echo "pushed=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --cached --quiet -- data/china.json data/china.js; then msg="ticker: 시세 $(date '+%m-%d %H:%M') BKK"; else msg="china: 中国要闻·시세 $(date '+%m-%d %H:%M') BKK"; fi
          git commit -q -m "$msg"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && { echo "pushed=1" >> "$GITHUB_OUTPUT"; echo "push 완료 $(git rev-parse --short HEAD)"; exit 0; }
            echo "push 실패($i) → $((i * 15))s 뒤 재시도"; git rebase --abort 2>/dev/null || true; sleep $((i * 15))
          done
          echo "push 실패" >&2; exit 1

      - name: Pages 배포 확인(push 로 자동 시작됨 — 90초 안에 이 커밋 빌드가 안 보이면 그때만 요청)
        if: steps.push.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for i in $(seq 1 9); do
            sleep 10
            if gh api "repos/${{ github.repository }}/pages/builds?per_page=5" --jq '.[].commit' | grep -q "$sha"; then echo "Pages 빌드 시작됨($sha)"; exit 0; fi
          done
          echo "Pages 빌드가 안 보여서 요청"; gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "Pages 빌드 요청 실패(무시)"

      - name: 수집 실패 표시(中国要闻이나 시세 중 하나라도 실패하면 빨간색 — 성공한 쪽은 위에서 이미 커밋됨)
        if: steps.china.outcome == 'failure' || steps.ticker.outcome == 'failure'
        run: |
          echo "china=${{ steps.china.outcome }} ticker=${{ steps.ticker.outcome }}"; exit 1
